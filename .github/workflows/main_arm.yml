name: Build-Arm
run-name: Build on Arm

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: ./test.sh

      - name: Login to DockerHub
        if: startsWith(github.ref, 'refs/tags')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag and push tested image
        if: startsWith(github.ref, 'refs/tags')
        run: |
          docker tag omero-server:test pwalczysko/omero-server-aarch64:${GITHUB_REF_NAME}
          docker push pwalczysko/omero-server-aarch64:${GITHUB_REF_NAME}